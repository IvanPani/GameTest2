<!doctype html><html lang="en"><meta charset="utf-8"><title>Game sound check</title>
<style>body{margin:0;background:#182b3d;color:white;font:12px sans-serif}button{margin:3px;padding:6px}#status{white-space:pre-wrap;margin:6px}#juego{width:min(100vw,400px);height:calc(100vh - 150px)}</style>
<button data-tier="1">Pickup x1</button><button data-tier="2">Pickup x2</button><button data-tier="3">Pickup x3</button><button data-tier="4">Pickup x4</button><button data-tier="5">Pickup x5</button><button id="hit">Hazard hit</button><pre id="status">Loading audio…</pre><div id="juego"></div>
<script type="module">
import Phaser from 'phaser';import Boot from '../src/boot.js';import Menu from '../src/menu.js';import Level from '../src/level.js';import End from '../src/end.js';
import {playerData} from '../src/player-data.js';import {GAME_AUDIO} from '../src/game-audio.js';
let saved=null;playerData.getStorage=()=>({getItem:()=>saved,setItem:(_,value)=>{saved=value;}});
let played=[];let cue='Click a pickup or hazard to audition real gameplay events.';
class TestMenu extends Menu{create(){super.create();this.scene.start('level');}}
class SoundLevel extends Level{
 create(){super.create();const original=this.sound.play.bind(this.sound);this.sound.play=(key,config)=>{const result=original(key,config);played.push({key,result});return result;};
 document.querySelector('#status').textContent=`${GAME_AUDIO.filter(([key])=>this.cache.audio.exists(key)).length}/6 sounds decoded.\n${cue}`;}
 update(){}
}
const game=new Phaser.Game({type:Phaser.AUTO,width:400,height:700,parent:'juego',scale:{mode:Phaser.Scale.FIT},scene:[Boot,TestMenu,SoundLevel,End]});
const prepare=()=>{const level=game.scene.getScene('level');for(const object of [...level.obstacles,...level.collectibles])object.shape.destroy();level.obstacles=[];level.collectibles=[];level.overlapsPlayer=()=>true;played=[];return level;};
const report=message=>{document.querySelector('#status').textContent=message+'\n'+played.map(p=>`${p.key}: playback ${p.result?'started':'FAILED'}`).join('\n')+'\nIsolated save; actual pickup and damage handlers.';};
for(const button of document.querySelectorAll('[data-tier]'))button.onclick=()=>{const level=prepare();const tier=Number(button.dataset.tier);level.combo=[0,4,14,29,49][tier-1];level.spawnCollectible();level.moveObjects(0);const ok=played.length===1&&played[0].key===`pickup-x${tier}`&&played[0].result;report(`${ok?'PASS':'FAIL'}: pickup awards at x${level.getActiveMultiplier()} and plays matching cue once.`);};
document.querySelector('#hit').onclick=()=>{const level=prepare();level.damageTimer=0;level.health=3;level.spawnObstacle(null,'rusty-nut');level.moveObjects(0);level.spawnObstacle(null,'toy-block');level.moveObjects(0);const ok=level.health===2&&played.length===1&&played[0].key==='hazard-hit'&&played[0].result;report(`${ok?'PASS':'FAIL'}: one bonk on damage; invulnerable contact stays silent.`);};
</script></html>
