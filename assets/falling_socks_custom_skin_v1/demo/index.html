<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Falling Socks skin preview</title><style>
body{margin:0;background:#172438;color:#f1eee7;font-family:sans-serif;text-align:center}main{max-width:900px;margin:auto}h1{font-size:29px}.gallery{display:flex;gap:15px;justify-content:center}.item{width:300px;background:#314158;border-radius:10px;padding:12px}.item canvas{width:260px;height:260px;object-fit:contain;image-rendering:auto}.item p{margin:8px}</style></head><body><main><h1>Falling Socks — customizable sock test</h1><div class="gallery"><div class="item"><canvas id="original" width="512" height="512"></canvas><p>Original</p></div><div class="item"><canvas id="green" width="512" height="512"></canvas><p>Green + yellow dots</p></div><div class="item"><canvas id="blue" width="512" height="512"></canvas><p>Blue + pink stripes</p></div></div><p id="status">Loading source sprite sheet...</p></main>
<script type="module">
import { recolorSockPixels } from '../src/sock-skin.js';
const img=new Image();img.onload=()=>{const a=document.createElement('canvas');a.width=img.width;a.height=img.height;const c=a.getContext('2d',{willReadFrequently:true});c.drawImage(img,0,0);const pixels=c.getImageData(0,0,img.width,img.height); document.getElementById('original').getContext('2d').drawImage(img,0,0,512,512,0,0,512,512);
for(const [id,style] of [['green',{bodyColor:'#8bc78b',accentColor:'#eecb68',patternColor:'#e94370',patternId:'dots'}],['blue',{bodyColor:'#8bbad7',accentColor:'#cc655a',patternColor:'#fce269',patternId:'stripes'}]]){
const out=recolorSockPixels(pixels.data,img.width,img.height,style);const oc=document.createElement('canvas');oc.width=img.width;oc.height=img.height;const ox=oc.getContext('2d');const o=ox.createImageData(img.width,img.height);o.data.set(out);ox.putImageData(o,0,0);document.getElementById(id).getContext('2d').drawImage(oc,0,0,512,512,0,0,512,512);}
document.getElementById('status').textContent='Generated 30-frame customizable sheets successfully'; document.body.dataset.finished='yes';};img.onerror=()=>document.getElementById('status').textContent='Image load failed'; img.src='./source-sheet.png';
</script></body></html>
